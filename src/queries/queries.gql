query ActivitiesSliderCard($endgt: DateTime, $limit: Int) {
  activities(end_Gt: $endgt, limit: $limit, hasPhotos: true) {
    results {
      photos {
        thumbMedium
      }
    }
  }
}

query HomepageSlider($limit: Int, $beginDate: DateTime) {
  activities(limit: $limit, begin_Lt: $beginDate, ordering: "begin,desc") {
    results {
      id
      description
      summary
      begin
      photos {
        thumbLarge
      }
    }
    totalCount
  }
}

query OverviewNews($limit: Int, $offset: Int) {
  # pinnedOnTop keeps pinned items first, exactly like the homepage block
  newsItems(limit: $limit, offset: $offset, pinnedOnTop: true) {
    results {
      id
      title
      introduction
      publicationDate
      pinned
    }
    totalCount
  }
}

query SingleActivities($id: ID) {
  activity(id: $id) {
    begin
    end
    entireDay
    id
    summary
    description
    imageIcon
    photos {
      thumbMedium
      thumbMediumHeight
      thumbMediumWidth
    }
    location
    hasCosts
    price
    activityLabel {
      nameEn
      explanationEn
    }
    organizer {
      name
    }
    enrollmentEnd
    enrollmentBegin
  }
}

query SingleNews($id: ID) {
  newsItem(id: $id) {
    content
    title
    publicationDate
    author
    id
  }
}

query EducationView {
  educationpages {
    results {
      id
      slug
      name
      content
    }
  }
}

query PageView($pageId: ID) {
  page(id: $pageId) {
    name
    slug
    content
  }
}

query PublicationOverview($limit: Int, $offset: Int, $type: String) {
  publicationTypes {
    typeName
  }
  publications(
    limit: $limit
    offset: $offset
    ordering: "datePublished,desc"
    publicationType_TypeName_Iexact: $type
  ) {
    results {
      id
      name
      description
      datePublished
      publicationType {
        typeName
        description
      }
      thumbnail
      file
      isFeatured
      public
    }
    totalCount
  }
}

query CommitteeOverview {
  committees(includeAbolished: false, limit: 500) {
    results {
      name
      slug
      id
      category {
        name
      }
    }
  }
}

query SingleCommittee($committeeId: ID) {
  committees(includeAbolished: false, id: $committeeId) {
    results {
      name
      slug
      id
      email
      founded
      website
      information
      groupPicture
      logo
      abolished
      category {
        name
      }
      functionSet {
        person
        function
      }
    }
  }
}

query CurrentUser {
  me {
    username
    firstName
    lastName
  }
}

mutation SetLanguageMutation($languageCode: String!) {
  setLanguage(languageCode: $languageCode) {
    language
    result
  }
}

query FrontPageBanners {
  websiteBanners {
    results {
      name
      picture
      url
    }
  }
}

query CompanyCorner($limit: Int, $offset: Int) {
  companies(limit: $limit, offset: $offset) {
    results {
      name
      slug
      url
      logo
      logoWidth
      logoHeight
      shortDescription
    }
    totalCount
  }
}

query Company($slug: String!) {
  company(slug: $slug) {
    name
    url
    logo
    profile
    shortDescription
  }
}

query Videos($limit: Int, $offset: Int) {
  videos(limit: $limit, offset: $offset) {
    totalCount
    results {
      videoId
      videoType
      title
      embedUrl
      thumbnailUrl
      datePublished
    }
  }
}

query Video($videoId: ID!) {
  video(videoId: $videoId) {
    videoId
    title
    description
    thumbnailUrl
    embedUrl
    videoType
    datePublished
  }
}

query Homepage($today: DateTime) {
  # Pinned news, shown first on the homepage
  pinnedNews: newsItems(pinned: true, limit: 2, ordering: "publication_date,desc") {
    totalCount
    results {
      id
      title
      introduction
      author
      publicationDate
      pinned
    }
  }

  # Regular news
  recentNews: newsItems(
    publicationDate_Lt: $today
    limit: 4
    ordering: "publication_date,desc"
  ) {
    totalCount
    results {
      id
      title
      introduction
      author
      publicationDate
      pinned
    }
  }

  # Recent publications
  publications(ordering: "date_published,desc", limit: 4) {
    totalCount
    results {
      id
      thumbnail
      name
      file
      datePublished
    }
  }

  # Latest video
  videos(limit: 1, ordering: "date_published,desc") {
    totalCount
    results {
      videoId
      videoType
      title
      thumbnailUrl
      datePublished
    }
  }
}
