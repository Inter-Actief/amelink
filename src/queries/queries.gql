query OverviewActivities($limit: Int, $offset: Int, $startDate: DateTime!) {
  activities(limit: $limit, offset: $offset, begin_Gt: $startDate, ordering: "begin,asc") {
    results {
      id
      begin
      summary
      description
      imageIcon
      activityLabel {
        name
        color
        active
      }
    }
    totalCount
  }
}

query PastActivities($limit: Int, $offset: Int, $endDate: DateTime, $search: String) {
  activities(
    limit: $limit
    offset: $offset
    ordering: "begin,desc"
    begin_Lt: $endDate
    summaryNl_Icontains: $search
  ) {
    totalCount
    results {
      id
      begin
      description
      summary
      photos {
        caption
      }
    }
  }
}

query PhotosActivities($id: ID) {
  activity(id: $id) {
    summary
    begin
    id
    description
    photos {
      thumbMedium
      thumbMediumHeight
      thumbMediumWidth
      thumbLarge
      created
      owner {
        name
      }
    }
  }
}

query UpcomingActivities($limit: Int, $offset: Int, $beginDate: DateTime) {
  activities(limit: $limit, offset: $offset, begin_Gt: $beginDate, ordering: "begin,asc") {
    results {
      id
      begin
      description
      summary
      imageIcon
      activityLabel {
        name
        color
        active
      }
    }
    totalCount
  }
}

query DemoOverviewActivities($limit: Int, $offset: Int, $beginDate: DateTime) {
  activities(limit: $limit, offset: $offset, begin_Gt: $beginDate, ordering: "begin,desc") {
    results {
      id
      begin
      description
      summary
      description
      activityLabel {
